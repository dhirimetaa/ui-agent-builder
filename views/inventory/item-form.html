<section class="max-w-3xl space-y-4 tab-wrapper" data-view-title="New Item">
  <div>
    <h1 class="text-xl font-semibold">New item</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400">General info, pricing, and attachments stay in one form.</p>
  </div>

  <form id="item-form" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl">
    <div class="flex border-b border-slate-200 dark:border-slate-800 px-2">
      <button type="button" data-tab-target="tab-general" class="px-4 py-3 text-sm font-medium border-b-2 border-indigo-600 text-indigo-600">General Info</button>
      <button type="button" data-tab-target="tab-pricing" class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500">Pricing &amp; Tax</button>
      <button type="button" data-tab-target="tab-files" class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500">Attachments &amp; Notes</button>
    </div>

    <div class="p-5 space-y-4">
      <div id="tab-general" class="tab-content space-y-4">
        <label class="block text-sm">
          <span class="font-medium">Item name</span>
          <input name="name" required class="mt-1 w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
        </label>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="block text-sm">
            <span class="font-medium">SKU</span>
            <input name="sku" required class="mt-1 w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
          </label>
          <label class="block text-sm">
            <span class="font-medium">Category</span>
            <select name="category" class="mt-1 w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3 py-2">
              <option>Electronics</option>
              <option>Office</option>
              <option>Home</option>
              <option>Apparel</option>
              <option>Supplies</option>
            </select>
          </label>
        </div>
      </div>

      <div id="tab-pricing" class="tab-content hidden space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="block text-sm">
            <span class="font-medium">Price</span>
            <input name="price" type="number" min="0" step="0.01" value="0" class="mt-1 w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
          </label>
          <label class="block text-sm">
            <span class="font-medium">Tax rate</span>
            <select name="tax" class="mt-1 w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3 py-2">
              <option>None</option>
              <option>Standard 8%</option>
              <option>Reduced 5%</option>
            </select>
          </label>
        </div>
      </div>

      <div id="tab-files" class="tab-content hidden space-y-4">
        <div data-dropzone class="dropzone rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 p-6 text-center">
          <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-500"></i>
          <p class="mt-2 text-sm font-medium">Drop files here or browse</p>
          <p class="text-xs text-slate-500 mt-1">PNG, JPG, PDF, CSV · 10 MB max</p>
          <input data-file-input type="file" accept=".png,.jpg,.jpeg,.pdf,.csv,image/png,image/jpeg,application/pdf,text/csv" multiple class="hidden">
          <button type="button" data-browse class="mt-3 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-sm">Browse files</button>
          <div data-progress class="hidden mt-4 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
            <div data-progress-bar class="h-full w-0 bg-indigo-600 transition-all"></div>
          </div>
        </div>
        <ul data-file-list class="flex flex-wrap gap-2"></ul>
        <label class="block text-sm">
          <span class="font-medium">Notes</span>
          <textarea name="notes" rows="3" class="mt-1 w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </label>
      </div>
    </div>

    <div class="flex justify-end gap-2 px-5 py-4 border-t border-slate-200 dark:border-slate-800">
      <button type="button" data-view="views/inventory/list.html" data-title="Inventory" class="px-3 py-2 rounded-lg text-sm border border-slate-200 dark:border-slate-700">Cancel</button>
      <button type="submit" class="px-3 py-2 rounded-lg text-sm bg-indigo-600 text-white font-medium hover:bg-indigo-500">Save item</button>
    </div>
  </form>
</section>
