<section class="space-y-4" data-view-title="Finance">
  <div>
    <h1 class="text-xl font-semibold">Receivables</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400">Open, paid, and overdue invoices.</p>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4">
      <p class="text-xs uppercase tracking-wide text-slate-400">Open</p>
      <p class="text-2xl font-semibold mt-1" data-finance-stat="open">—</p>
    </article>
    <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4">
      <p class="text-xs uppercase tracking-wide text-slate-400">Overdue</p>
      <p class="text-2xl font-semibold mt-1" data-finance-stat="overdue">—</p>
    </article>
    <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4">
      <p class="text-xs uppercase tracking-wide text-slate-400">Collected</p>
      <p class="text-2xl font-semibold mt-1" data-finance-stat="paid">—</p>
    </article>
  </div>
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 dark:bg-slate-950 text-left text-slate-500">
        <tr>
          <th class="px-4 py-3 font-medium">Invoice</th>
          <th class="px-4 py-3 font-medium">Customer</th>
          <th class="px-4 py-3 font-medium">Amount</th>
          <th class="px-4 py-3 font-medium">Due</th>
          <th class="px-4 py-3 font-medium">Status</th>
        </tr>
      </thead>
      <tbody data-finance-body class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
    </table>
  </div>
</section>
